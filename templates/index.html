<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI YouTube Studio</title><style>body{margin:0;background:#0c1222;color:#eef5ff;font:16px system-ui}main{max-width:760px;margin:65px auto;padding:22px}h1{font-size:2.4rem}p{color:#afc1d6}.panel{background:#17243b;border:1px solid #314666;padding:28px;border-radius:18px}input,button{box-sizing:border-box;padding:15px;font-size:16px;border-radius:10px}input{width:100%;background:#0c1528;color:white;border:1px solid #54718d}button{margin-top:14px;background:#38bdf8;border:0;font-weight:700;cursor:pointer}a{color:#7dd3fc}video{width:100%;margin-top:18px;border-radius:12px}</style></head><body><main><h1>🎬 AI YouTube Studio</h1><p>Generate a four-scene video draft from any topic. Script AI, voiceovers and publishing are planned upgrades.</p><div class="panel"><form id="form"><label for="topic">Video topic</label><input id="topic" name="topic" minlength="3" maxlength="120" required placeholder="How desalination works"><button>Generate video</button></form><p id="status" role="status"></p><div id="result"></div></div></main><script>const form=document.querySelector('#form'),status=document.querySelector('#status'),result=document.querySelector('#result');form.addEventListener('submit',async e=>{e.preventDefault();result.replaceChildren();status.textContent='Submitting...';try{const r=await fetch('/api/generate',{method:'POST',body:new FormData(form)});const j=await r.json();if(!r.ok)throw Error(j.detail||'Request failed');const poll=async()=>{const r=await fetch('/api/jobs/'+j.job_id);if(!r.ok)throw Error('Job unavailable');const s=await r.json();status.textContent='Status: '+s.status;if(s.status==='ready'){const url='/api/jobs/'+j.job_id+'/download';const a=document.createElement('a');a.href=url;a.textContent='Download MP4';const v=document.createElement('video');v.controls=true;v.src=url;result.append(a,v)}else if(s.status==='failed'){status.textContent='Error: '+s.error}else setTimeout(poll,1500)};poll().catch(err=>status.textContent=err.message)}catch(err){status.textContent=err.message}})</script></body></html>
